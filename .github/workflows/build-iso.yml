name: Build EverGreenOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "distribution/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap debian-archive-keyring isolinux syslinux-common
          cat /etc/os-release
          apt-cache policy live-build debootstrap

      - name: Configure Debian live image
        run: |
          mkdir -p build
          cd build
          set -o pipefail
          bash -x "$(command -v lb)" config --debug --ignore-system-defaults \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --initsystem systemd \
            --debian-installer false \
            --security false \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-chroot-security https://security.debian.org/debian-security \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-binary-security https://security.debian.org/debian-security 2>&1 | tee ../lb-config-trace.log

          if [ -d ../distribution/config ]; then
            cp -a ../distribution/config/. config/
          fi

          # Resolve bootloader files from the installed Debian packages.
          ISOLINUX_BIN="$(dpkg -L isolinux | grep -E '/isolinux\\.bin$' | head -n 1)"
          VESAMENU="$(dpkg -L syslinux-common | grep -E '/vesamenu\\.c32$' | head -n 1)"
          test -n "$ISOLINUX_BIN"
          test -n "$VESAMENU"
          mkdir -p config/bootloaders/isolinux
          cp -L "$ISOLINUX_BIN" config/bootloaders/isolinux/isolinux.bin
          cp -L "$VESAMENU" config/bootloaders/isolinux/vesamenu.c32
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/vesamenu.c32
          echo "Prepared ISOLINUX bootloader files:"
          ls -l config/bootloaders/isolinux/

          mkdir -p config/package-lists
          cp ../distribution/package-lists/evergreen.list.chroot config/package-lists/
          echo "Generated Evergreen package list:"
          cat config/package-lists/evergreen.list.chroot

      - name: Build ISO
        run: |
          cd build
          lb build

      - name: Verify ISO exists
        run: |
          test -n "$(find build -maxdepth 1 -type f -name '*.iso' -print -quit)"
          ls -lh build/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: evergreenos-amd64-iso
          path: build/*.iso
          if-no-files-found: error
          retention-days: 7
