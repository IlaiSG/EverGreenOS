name: Build EverGreenOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "distribution/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build and Debian archive keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring isolinux syslinux-common

      - name: Prepare BIOS bootloader files for live-build
        run: |
          sudo mkdir -p /root/isolinux
          ISOLINUX_BIN="$(find /usr/lib -type f -name isolinux.bin -print -quit)"
          VESAMENU="$(find /usr/lib -type f -name vesamenu.c32 -print -quit)"
          test -n "$ISOLINUX_BIN"
          test -n "$VESAMENU"
          sudo cp "$ISOLINUX_BIN" /root/isolinux/isolinux.bin
          sudo cp "$VESAMENU" /root/isolinux/vesamenu.c32
          ls -l /root/isolinux

      - name: Patch live-build Debian firmware index path
        run: |
          SCRIPT=/usr/lib/live/build/lb_chroot_linux-image
          sudo test -f "$SCRIPT"
          sudo sed -i \
            -e 's|/dists/${LB_PARENT_DISTRIBUTION}/Contents-|/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|/dists/${LB_DISTRIBUTION}/Contents-|/dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            "$SCRIPT"
          grep -n 'Contents-' "$SCRIPT"

      - name: Configure Debian live image
        run: |
          mkdir -p build
          cd build
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --initsystem systemd \
            --debian-installer false \
            --security false \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-chroot-security https://security.debian.org/debian-security \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-binary-security https://security.debian.org/debian-security

          # Copy first-party live-build configuration into the generated config tree.
          if [ -d ../distribution/config ]; then
            cp -a ../distribution/config/. config/
          fi

          mkdir -p config/package-lists
          cp ../distribution/package-lists/evergreen.list.chroot config/package-lists/
          echo "Generated Evergreen package list:"
          cat config/package-lists/evergreen.list.chroot

      - name: Build ISO
        run: |
          cd build
          sudo lb build

      - name: Verify ISO exists
        run: |
          test -n "$(find build -maxdepth 1 -type f -name '*.iso' -print -quit)"
          ls -lh build/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: evergreenos-amd64-iso
          path: build/*.iso
          if-no-files-found: error
          retention-days: 7
